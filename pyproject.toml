[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vjepa2"
dynamic = ["version"]
description = "PyTorch code and models for V-JEPA 2."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile="black"
line_length=119

[tool.black]
line-length = 119
